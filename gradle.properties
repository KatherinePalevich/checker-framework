# Gradle will fork up to org.gradle.workers.max JVMs to execute tasks in parallel.
# (The default value of org.gradle.workers.max is the number of CPU processors.)
org.gradle.parallel=true

org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.caching=true

# If you update errorproneVersion:
#  * Temporarily comment out "-Werror" in build.gradle files.
#  * Repeatedly run `./gradlew clean compileJava` and fix all errors.
#  * Uncomment "-Werror".

autoValueVersion=1.11.0
errorproneVersion=2.43.0
googleJavaFormatVersion=1.30.0
hashmapUtilVersion=0.0.1
junitVersion=4.13.2
lombokVersion=1.18.42
plumeUtilVersion=1.11.0
reflectionUtilVersion=1.1.5

# Use JDK 21 for running tests and compiling when not otherwise overridden.
# You can still override these on the command line, e.g. `./gradlew -PjdkTestVersion=17`.
jdkTestVersion=21
# Set to true to force the project to use the JDK 21 compiler for compilation.
useJdk21Compiler=true
